name: Test

on:
  push:
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      # changed_keys は「どの bucket に当たったか」で、files_yaml だけを渡した
      # ときに出る唯一のまとめである。any_changed は出ない（action の
      # src/changedFiles.ts:37,105 が files を渡したときにしか設定しない）ので、
      # それで書いていた test-no-need はこれまで一度も走っていなかった。
      changed_keys: ${{ steps.files.outputs.changed_keys }}
      go_any_changed: ${{ steps.files.outputs.go_any_changed }}
      actions_any_changed: ${{ steps.files.outputs.actions_any_changed }}
      md_any_changed: ${{ steps.files.outputs.md_any_changed }}
      pipeline_any_changed: ${{ steps.files.outputs.pipeline_any_changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run changes
        id: files
        uses: tj-actions/changed-files@ed68ef82c095e0d48ec87eccea555d944a631a4c # v46.0.5
        with:
          files_yaml: |
            md:
              - '**.md'
            go:
              - '**.go'
              - go.mod
              - go.sum
              # テストが読む固定コピー。Sheets 等価テストと実績突合テストの
              # 右辺がここにあるので、外すと突合の相手だけが書き換わった PR が
              # 何も検査されないまま緑になる。
              - 'testdata/**'
            # 入力そのものと、依存グラフを持つ Makefile。ここを見落とすと、
            # 制度表だけを直した PR も Makefile だけを直した PR も、
            # 何も検査されないまま緑になる。
            pipeline:
              - 'data/**'
              - 'projects/**'
              - 'actuals/**'
              - Makefile
              - 'pipeline/**'
            actions:
              - .github/workflows/**.yml
              - .github/workflows/**.yaml

  actionlint:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.actions_any_changed == 'true'
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - uses: aquaproj/aqua-installer@d1fe50798dbadd4eb5b98957290ca175f6b4870f # v4.0.2
        with:
          aqua_version: v2.53.9

      - name: Run actionlint
        run: actionlint

      - name: Run ghalint
        run: ghalint run

  go-test:
    runs-on: ubuntu-latest
    needs: changes
    # Markdown の変更でも走らせる。data/law の各行の 出典 は原本の代わりに
    # 置いた .md を名指しており、law のテストがその存在を見ているため、
    # Go だけを条件にすると出典の切れた行が素通りする。
    #
    # 入力と Makefile の変更でも走らせる。Sheets 等価・実績突合・性質・
    # 決定性のテストはどれも入力テーブルを読む Go のテストで、
    # pipeline パッケージは Makefile を走らせる。
    # workflow の変更でも走らせる。この workflow の配線を見張っているのは
    # ci パッケージの Go のテストで、actions を条件に入れないと、
    # 見張られている当のものが変わったときにだけ走らない。
    if: |
      needs.changes.outputs.go_any_changed == 'true'
        || needs.changes.outputs.md_any_changed == 'true'
        || needs.changes.outputs.pipeline_any_changed == 'true'
        || needs.changes.outputs.actions_any_changed == 'true'
    permissions:
      contents: read
    # pipeline パッケージがリポジトリの複製の上で make を何度も走らせる。
    # 手元で suite 全体が 5.8s から 30.2s になった。5 分は 6 秒の頃の値である。
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

  # 一気通貫を CI で走らせる。make が検査（フラグなしの validate）から
  # 比較までを順に走らせるので、ここで走るのは Makefile が持つ依存グラフ
  # そのものである。-allow-missing は使わない（決定 22）。
  pipeline:
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.go_any_changed == 'true'
        || needs.changes.outputs.pipeline_any_changed == 'true'
        || needs.changes.outputs.actions_any_changed == 'true'
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod

      - name: Run the pipeline
        run: make

  test-no-need:
    name: Empty
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.changed_keys == ''
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: Skip
        run: echo "No changes in files related to tests, skipping."
